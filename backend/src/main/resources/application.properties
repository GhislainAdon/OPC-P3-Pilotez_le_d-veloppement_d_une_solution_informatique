spring.application.name=datashare-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datashare}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Multipart configuration (Supports file uploads up to 1GB)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Custom Upload directory
file.upload-dir=${UPLOAD_DIR:./uploads}

# CORS — origines autorisées (séparées par virgule).
# En production, positionner CORS_ALLOWED_ORIGINS=https://app.datashare.example
# pour restreindre aux origines légitimes du frontend déployé.
#
# Codespaces GitHub : les URLs sont de la forme https://<codespace-name>-<port>.app.github.dev
# où <codespace-name> est unique à chaque codespace. On utilise le pattern exact
# "*.app.github.dev" via allowedOriginPatterns en complément de la liste stricte.
# Exemple d'URL Codespaces : https://bookish-space-pancake-656x7q7p77f4gjw-80.app.github.dev/
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:80,http://localhost:4200,http://localhost,https://*.app.github.dev}

# JWT Configurations
security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 1 day in milliseconds
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}
