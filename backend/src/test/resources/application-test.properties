# =====================================================================
# Profil de test : H2 en mémoire (au lieu de PostgreSQL)
# =====================================================================
# Permet aux tests @SpringBootTest (FileControllerTest, AuthControllerTest,
# BackendApplicationTests) de charger le contexte Spring sans dépendre d'un
# serveur PostgreSQL externe. Les tests n'écrivent pas réellement en base
# car les services sont mockés via @MockitoBean, mais Spring doit quand même
# résoudre le bean DataSource au démarrage du contexte.
#
# Note : pour des tests d'intégration réels sur PostgreSQL (connexion JPA,
# migrations Flyway, contraintes SQL), on utilisera Testcontainers
# PostgreSQL (voir TESTING.md § Tests d'intégration PostgreSQL).

spring.datasource.url=jdbc:h2:mem:datashare-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA : create-drop pour repartir d'un schéma vierge à chaque exécution
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Désactiver la tâche cron @Scheduled pendant les tests
spring.task.scheduling.enabled=false

# Multipart : taille plus petite pour tester le rejet 413 plus rapidement
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire de stockage temporaire pour les tests
file.upload-dir=${java.io.tmpdir}/datashare-test-uploads

# JWT : clé de test (ne pas utiliser en production)
security.jwt.secret-key=test-secret-key-for-unit-tests-only-not-for-production-usage-1234567890
security.jwt.expiration-time=3600000

# CORS : origines autorisées en test
cors.allowed-origins=http://localhost:4200,http://localhost
